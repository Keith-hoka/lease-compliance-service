[project]
name = "lease-compliance-service"
version = "0.1.0"
description = "Deterministic NSW residential lease compliance audits with a temporal legislation store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.120.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.2",
    "openai>=2.53.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "selectolax>=0.4.11",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8",
    "httpx>=0.28.1",
    "pillow>=10.1",
    "playwright>=1.61.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["llm_eval: real-model eval; costs money, run explicitly with -m llm_eval"]
addopts = "-m 'not llm_eval'"
